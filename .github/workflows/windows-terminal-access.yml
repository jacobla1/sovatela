name: windows terminal access

# Runs deploy/claude-glm/install-claude-glm.ps1 on real Windows and then drives
# the launcher it installs, end to end.
#
# This exists because the Windows install path shipped unverified through 1.2.0
# and 1.3.0. The app side was confirmed on hardware; pressing **Install** was
# not, and the release notes have carried that disclosure for two releases. The
# parts nobody had run: fetching uv over Invoke-RestMethod, installing LiteLLM
# with the FastAPI pin, the persistent user PATH edit, whether the claude-glm
# shim resolves in a new terminal, and the launcher's CredReadW P/Invoke —
# which is separate code from the app's keyring read, so a working key in the
# app proves nothing about it.
#
# From 1.6.1 this job is also the gate on whether Windows may offer the feature
# at all. `terminal_access_available()` in src-tauri/src/lib.rs enables macOS and
# Linux and not Windows, because the Windows launcher had never been run
# anywhere: Windows containers do not run on macOS, so the Docker check that
# cleared Linux (deploy/claude-glm/verify-linux-docker.sh) cannot cover it.
#
# The security assertions below are what would change that. They are the same
# ones verify-launcher.sh makes on the other two platforms, and they matter more
# here, because the Windows launcher is the one that differs in mechanism: it
# sets the Scaleway key and clears it around a single Start-Process, since
# Start-Process inherits the parent environment and -Environment needs
# PowerShell 7.4+ while Windows ships 5.1.
#
# What is deliberately NOT covered: a real Scaleway call. That needs a paid key,
# and the proxy answering /v1/models proves LiteLLM started with our config,
# which is where this has actually broken before.
#
# `claude` is a stub here. What is under test is our installer and our launcher,
# not Anthropic's CLI: the installer only checks that `claude` is on PATH, and
# the launcher only invokes it. A stub proves both, and keeps the run from
# trying to authenticate a real Claude Code session on a throwaway machine.

on:
  workflow_dispatch:
  # Called by the release workflow, which will not build installers until this
  # passes. Two encoding defects shipped in 1.2.0 and 1.3.0 that made this path
  # impossible on every Windows machine; a release that cannot run it is a
  # release that can carry the third one.
  workflow_call:
  push:
    paths:
      - "deploy/claude-glm/install-claude-glm.ps1"
      - ".github/workflows/windows-terminal-access.yml"

jobs:
  install:
    # Not on the public mirror: it receives this file with the source, so a
    # push or a tag there would run a Windows installer test for a repository
    # that never builds anything.
    if: github.repository == 'jacobla1/Scale'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stub `claude` on PATH (the installer's one prerequisite)
        shell: pwsh
        run: |
          $stub = Join-Path $env:USERPROFILE 'claude-stub'
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          # Prints a marker, echoes its arguments, and dumps its own environment.
          # The dump is the point: this stands in for the agent, and the finding
          # that withdrew this feature was that the agent could read the Scaleway
          # key out of the environment it was started with.
          @"
          @echo off
          echo CLAUDE-STUB-REACHED args=%*
          set > "%USERPROFILE%\claude-env.txt"
          "@ | Set-Content -LiteralPath (Join-Path $stub 'claude.cmd') -Encoding ASCII
          "$stub" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Seed a Sovatela credential, the way the app writes it
        shell: pwsh
        run: |
          # keyring 3.x on Windows stores one generic credential under
          # "<account>.<service>" with the secret as a UTF-16LE blob. The app
          # writes its whole secrets JSON there; the launcher reads it back with
          # CredReadW. This writes the same shape with a throwaway key.
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          namespace Seed {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
            public struct CREDENTIAL {
              public uint Flags; public uint Type; public IntPtr TargetName; public IntPtr Comment;
              public System.Runtime.InteropServices.ComTypes.FILETIME LastWritten;
              public uint CredentialBlobSize; public IntPtr CredentialBlob; public uint Persist;
              public uint AttributeCount; public IntPtr Attributes; public IntPtr TargetAlias; public IntPtr UserName;
            }
            public static class Native {
              [DllImport("advapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)]
              public static extern bool CredWriteW(ref CREDENTIAL cred, uint flags);
              public static bool Write(string target, string user, string secret) {
                byte[] blob = System.Text.Encoding.Unicode.GetBytes(secret);
                CREDENTIAL c = new CREDENTIAL();
                c.Type = 1; c.Persist = 2;
                c.TargetName = Marshal.StringToCoTaskMemUni(target);
                c.UserName   = Marshal.StringToCoTaskMemUni(user);
                c.CredentialBlob = Marshal.AllocCoTaskMem(blob.Length);
                Marshal.Copy(blob, 0, c.CredentialBlob, blob.Length);
                c.CredentialBlobSize = (uint)blob.Length;
                return CredWriteW(ref c, 0);
              }
            }
          }
          "@
          $json = '{"scaleway_api_key":"SCW-CHAT-KEY-FOR-TEST","claude_glm_api_key":"SCW-TERMINAL-KEY-FOR-TEST"}'
          if (-not [Seed.Native]::Write('secrets.com.anaubi.sovatela', 'secrets', $json)) {
            throw "CredWriteW failed: $([ComponentModel.Win32Exception]::new([Runtime.InteropServices.Marshal]::GetLastWin32Error()).Message)"
          }
          Write-Host "seeded secrets.com.anaubi.sovatela"

      - name: Run the installer exactly as the docs tell a user to
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File deploy\claude-glm\install-claude-glm.ps1

      - name: What the installer was supposed to leave behind
        shell: pwsh
        run: |
          $fail = @()
          function Check($label, $condition, $detail) {
            if ($condition) { Write-Host "  ok      $label" }
            else { Write-Host "  FAILED  $label — $detail"; $script:fail += $label }
          }

          $cfg = Join-Path $env:USERPROFILE '.claude-glm'
          $bin = Join-Path $env:USERPROFILE 'bin'
          $uvBin = Join-Path $env:USERPROFILE '.local\bin'
          $venv = Join-Path $cfg 'venv'

          # uv lives in the app's own directory now, verified against a
          # hard-coded checksum. This assertion still looked in the global
          # ~/.local\bin the old bootstrap used, so it failed on a correct
          # install and stopped the ownership and end-to-end steps from running.
          Check "uv installed for this app" (Test-Path (Join-Path $cfg 'uv\uv.exe'))       "no uv.exe in $cfg\uv"
          Check "uv is NOT installed globally" (-not (Test-Path (Join-Path $uvBin 'uv.exe'))) "the global bootstrap ran"
          Check "lock is content-pinned"   ((Select-String -LiteralPath (Join-Path $cfg 'requirements.lock') -Pattern '--hash=sha256:' -AllMatches).Matches.Count -gt 1000) "no hashes in the lock"
          # In the app's own virtual environment, not the global uv tool
          # directory. `uv tool install --force` used to replace a LiteLLM the
          # user had installed for other work.
          Check "litellm in our venv"   (Test-Path (Join-Path $venv 'Scripts\litellm.exe')) "no litellm.exe in $venv"
          Check "versions pinned"       (Test-Path (Join-Path $cfg 'requirements.lock'))   "no requirements.lock"
          Check "litellm.yaml written"  (Test-Path (Join-Path $cfg 'litellm.yaml'))        "missing"
          Check "proxy key written"     (Test-Path (Join-Path $cfg 'proxy-key'))           "missing"
          Check "launcher written"      (Test-Path (Join-Path $cfg 'claude-glm.ps1'))      "missing"
          Check "cmd shim written"      (Test-Path (Join-Path $bin 'claude-glm.cmd'))      "missing"
          # By contents. The app reads this file to decide whether to tell
          # someone their key was exposed; a source test for the word "layout"
          # passed on comments alone.
          $state = $null
          try { $state = Get-Content -LiteralPath (Join-Path $cfg 'state.json') -Raw | ConvertFrom-Json } catch { }
          Check "state document written"  ($null -ne $state)                        "state.json missing or unreadable"
          Check "install marked complete" ($state.install_status -eq 'complete')    "got '$($state.install_status)'"
          Check "layout version is 2"     ($state.layout_version -eq 2)             "got '$($state.layout_version)'"
          # A fresh install must not claim an exposure it cannot establish.
          Check "no false legacy claim"   ($state.legacy_seen -eq $false)           "a fresh install claimed prior exposure"

          # A global litellm the user already had must survive the install.
          # Guarded: from 1.6.1 there is deliberately no global uv, so invoking
          # one is a command-not-found that takes the whole step down before the
          # remaining checks run — which is what happened, and why this job
          # reported a failure with every check it printed marked ok.
          if (Test-Path (Join-Path $uvBin 'uv.exe')) {
            $global = & (Join-Path $uvBin 'uv.exe') tool list 2>$null | Out-String
            Write-Host "  global uv tools after install: $($global.Trim())"
          } else {
            Write-Host "  no global uv — as intended from 1.6.1"
          }

          # The FastAPI pin is the fix for a proxy that could not start at all.
          $pinned = & (Join-Path $venv 'Scripts\python.exe') -c "import fastapi; print(fastapi.__version__)" 2>$null
          Write-Host "  fastapi in our venv: $pinned"
          # Packages, not lines: the lock is ~2,771 lines and 110 packages, and
          # printing the line count as a package count is the evidence drift this
          # project has been repeatedly caught by.
          $pkgs = (Select-String -LiteralPath (Join-Path $cfg 'requirements.lock') -Pattern '^[a-zA-Z0-9_.-]+==' -AllMatches).Matches.Count
          Write-Host "  packages pinned by content: $pkgs"

          # The PATH edit must be persistent — a new terminal reads the registry,
          # not this process.
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          Check "PATH edit persisted" (($userPath -split ';') -contains $bin) "User PATH is: $userPath"

          if ($fail.Count) { throw "$($fail.Count) check(s) failed: $($fail -join ', ')" }

      - name: The config must be readable the way LiteLLM reads it
        shell: pwsh
        run: |
          # This check exists because the first version of it was wrong. It
          # forced encoding='utf-8', which quietly handles a BOM — so it passed
          # while LiteLLM, which uses a bare open(), failed on the same file.
          # A test that opens a file more carefully than the program under test
          # proves nothing. So: no BOM, and it must parse under the machine's
          # locale encoding, which is what Python actually uses here.
          $p = Join-Path $env:USERPROFILE '.claude-glm\litellm.yaml'
          $bytes = [IO.File]::ReadAllBytes($p)
          $head = ($bytes[0..7] | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          Write-Host "first 8 bytes : $head"
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw "litellm.yaml starts with a UTF-8 BOM — LiteLLM will fail to parse it"
          }
          # The path goes in as an argument rather than being pasted into the
          # source: a Windows path is full of backslashes, and generating code
          # that quotes them correctly is a second thing to get wrong.
          $code = 'import sys, locale, yaml; p = sys.argv[1];' +
                  ' print("  locale encoding:", locale.getpreferredencoding(False));' +
                  ' yaml.safe_load(open(p));' +
                  ' print("  parses with a bare open() -- as LiteLLM reads it")'
          & (Join-Path $env:USERPROFILE '.claude-glm\venv\Scripts\python.exe') -c $code $p
          if ($LASTEXITCODE -ne 0) { throw "litellm.yaml does not parse the way LiteLLM parses it" }

      - name: Does `claude-glm` resolve in a NEW terminal?
        shell: pwsh
        run: |
          # A new terminal composes PATH from the machine and user values in the
          # registry. Rebuilding it here is what makes this a real test of the
          # PATH edit rather than of this job's inherited environment.
          $fresh = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
                   [Environment]::GetEnvironmentVariable('Path','User')
          $resolved = & cmd /c "set PATH=$fresh&& where claude-glm" 2>&1
          Write-Host "where claude-glm -> $resolved"
          if ($LASTEXITCODE -ne 0) { throw "claude-glm does not resolve in a new terminal" }

      - name: The ownership predicate must fail closed
        shell: pwsh
        run: |
          # The hostile-listener step below plants on the obsolete fixed port
          # 4000, which the launcher never touches — so it proves the launcher
          # ignores 4000, and nothing about what happens when something claims
          # the ephemeral port it did pick. Racing a randomly chosen port is not
          # something a CI job can do reliably, so the decision is a pure
          # function and is tested here directly, with the inputs that matter.
          $src = Get-Content (Join-Path $env:USERPROFILE '.claude-glm\claude-glm.ps1') -Raw
          $fn = [regex]::Match($src, "(?s)function Test-ListenerIsOurs \{.*?\n\}").Value
          if (-not $fn) { throw "Test-ListenerIsOurs is gone from the installed launcher" }
          Invoke-Expression $fn

          $cases = @(
            @{ n = "a listener in our tree is ours";        o = @(42);      u = @(7, 42); want = $true  },
            @{ n = "no owner found fails closed";           o = @();        u = @(7, 42); want = $false },
            @{ n = "a null owner fails closed";             o = @($null);   u = @(7, 42); want = $false },
            @{ n = "a foreign owner is refused";            o = @(99);      u = @(7, 42); want = $false },
            @{ n = "one foreign among ours is refused";     o = @(42, 99);  u = @(7, 42); want = $false },
            @{ n = "pids as strings still compare";         o = @("42");    u = @(7, 42); want = $true  }
          )
          $fail = 0
          foreach ($c in $cases) {
            $got = Test-ListenerIsOurs -Owners $c.o -Ours $c.u
            if ($got -ne $c.want) { Write-Host "  FAIL  $($c.n)"; $fail++ }
            else { Write-Host "  PASS  $($c.n)" }
          }

          # And the ordering: ownership must be established before the readiness
          # request, which is what carries the bearer token.
          $body = [regex]::Match($src, "(?s)\$owners = @\(\).*").Value
          $owned = $body.IndexOf("Test-ListenerIsOurs")
          $sent  = $body.IndexOf("Test-Proxy")
          if ($owned -lt 0 -or $sent -lt 0) { throw "the readiness loop no longer looks like itself" }
          if ($owned -gt $sent) { Write-Host "  FAIL  the token is sent before ownership is checked"; $fail++ }
          else { Write-Host "  PASS  ownership is checked before the token is sent" }

          if ($fail) { throw "$fail ownership check(s) failed" }

      - name: Plant a hostile listener on the port the old launcher trusted
        shell: pwsh
        run: |
          # Through 1.6.0 the launcher probed a fixed 127.0.0.1:4000 and treated
          # any authenticated 200 as proof its own proxy was up — handing the
          # proxy token, and then the session, to whatever had bound the port
          # first. Loopback is machine-wide, so on a shared computer that is any
          # other local account. This sits there and records anything it is sent.
          $log = Join-Path $env:RUNNER_TEMP 'hostile.log'
          "" | Set-Content -LiteralPath $log
          $job = Start-Job -ScriptBlock {
            param($log)
            $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 4000)
            $l.Start()
            while ($true) {
              $c = $l.AcceptTcpClient()
              Add-Content -LiteralPath $log -Value "contacted"
              $s = $c.GetStream()
              $b = [Text.Encoding]::ASCII.GetBytes("HTTP/1.1 200 OK`r`nContent-Length: 13`r`n`r`n{""data"":[]}`r`n")
              $s.Write($b, 0, $b.Length); $s.Flush(); $c.Close()
            }
          } -ArgumentList $log
          "$($job.Id)" | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'hostile.job')
          Start-Sleep -Seconds 3
          Write-Host "hostile listener on 127.0.0.1:4000 (job $($job.Id))"

      - name: Drive the launcher end to end
        shell: pwsh
        env:
          # Fake, and never used against Scaleway: the run stops at the stub.
          SEEDED: "1"
        run: |
          # This is the whole point of the job. Running the shim exercises the
          # real launcher: the CredReadW read of the seeded credential, locating
          # litellm outside PATH, starting the proxy against litellm.yaml, and
          # finally invoking `claude` — the stub, which prints its marker.
          $fresh = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
                   [Environment]::GetEnvironmentVariable('Path','User') + ';' +
                   (Join-Path $env:USERPROFILE 'claude-stub')
          # Output goes to a file, not through a pipe. `| Out-String` waits for
          # every writer to the pipe to close, and the launcher leaves the proxy
          # running on purpose — so the pipeline blocks forever on a run that
          # actually succeeded. A user in a terminal never pipes it; this
          # deadlock was the harness, not the product.
          $outFile = Join-Path $env:RUNNER_TEMP 'launcher-out.txt'
          # A provider secret already in the user's shell, as anyone using
          # Scaleway's own CLI would have. The launcher has to strip it: a
          # claude-glm session is a context the launcher created, so handing that
          # key to an agent is the launcher's problem whoever set it.
          $line = "set PATH=$fresh&& set SCW_SECRET_KEY=A-KEY-FROM-THE-USERS-OWN-SHELL&& " +
                  "claude-glm --version > ""$outFile"" 2>&1"
          $proc = Start-Process cmd -ArgumentList '/c', $line -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill()
            throw "claude-glm had not finished after 3 minutes"
          }
          $out = if (Test-Path $outFile) { Get-Content $outFile -Raw } else { "" }
          Write-Host $out
          if ($out -notmatch 'CLAUDE-STUB-REACHED') {
            throw "the launcher never reached claude — see the proxy logs in the next step"
          }
          if ($out -match 'Could not read the Sovatela credential') {
            throw "CredReadW could not read the credential the app writes"
          }
          Write-Host "launcher reached claude with the proxy up"

      - name: The agent must not be able to see any provider secret
        shell: pwsh
        run: |
          # This step is the gate. Everything above proves the installer and the
          # launcher work; this proves the thing that withdrew the feature is
          # fixed on Windows too. Only when this passes should `windows` be added
          # to `terminal_access_available()` in src-tauri/src/lib.rs.
          $fail = @()
          function Check($label, $condition, $detail) {
            if ($condition) { Write-Host "  PASS  $label" }
            else { Write-Host "  FAIL  $label — $detail"; $script:fail += $label }
          }

          $envFile = Join-Path $env:USERPROFILE 'claude-env.txt'
          if (-not (Test-Path $envFile)) { throw "the agent stub never ran — no environment to inspect" }
          $agent = Get-Content -LiteralPath $envFile -Raw

          # The two keys seeded into Credential Manager, and the one planted in
          # the shell. None may appear in what the agent was started with.
          foreach ($secret in @('SCW-CHAT-KEY-FOR-TEST','SCW-TERMINAL-KEY-FOR-TEST','A-KEY-FROM-THE-USERS-OWN-SHELL')) {
            Check "the agent cannot see $secret" ($agent -notmatch [regex]::Escape($secret)) "found in its environment"
          }
          foreach ($name in @('SCW_SECRET_KEY','SCW_ACCESS_KEY','CLAUDE_GLM_PROXY_KEY','BFL_API_KEY','OVH_API_KEY','LINKUP_API_KEY','STAAN_API_KEY','SEARXNG_TOKEN','ANTHROPIC_API_KEY')) {
            Check "$name is not set for the agent" ($agent -notmatch "(?m)^$name=") "present"
          }

          # The proxy it was pointed at, and the port it was not.
          $base = ([regex]::Match($agent, '(?m)^ANTHROPIC_BASE_URL=(.+)$')).Groups[1].Value.Trim()
          Write-Host "  agent was pointed at: $base"
          Check "the agent was given a loopback proxy" ($base -match '^http://127\.0\.0\.1:\d+$') "got '$base'"
          Check "the port is not the fixed one anything could squat" ($base -notmatch ':4000$') "still 4000"

          $log = Join-Path $env:RUNNER_TEMP 'hostile.log'
          $contacted = (Test-Path $log) -and ((Get-Content -LiteralPath $log -Raw).Trim().Length -gt 0)
          Check "the listener on :4000 was never contacted" (-not $contacted) "it received a request"

          # The proxy is this session's child, so it goes when the session does.
          $left = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*claude-glm*litellm*' }
          Check "the proxy stopped with the session" (-not $left) "still running: $($left.ProcessId -join ', ')"

          if ($fail.Count) { throw "$($fail.Count) security check(s) failed: $($fail -join ', ')" }
          Write-Host ""
          Write-Host "Windows launcher holds the same properties as macOS and Linux."
          Write-Host "This is the evidence for adding windows to terminal_access_available()."

      - name: Stop the hostile listener
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'hostile.job'
          if (Test-Path $f) { Stop-Job -Id (Get-Content $f) -ErrorAction SilentlyContinue }

      - name: Proxy logs, whatever happened
        if: always()
        shell: pwsh
        run: |
          $cfg = Join-Path $env:USERPROFILE '.claude-glm'
          foreach ($f in 'litellm.log','litellm.err.log') {
            $p = Join-Path $cfg $f
            Write-Host "===== $f ====="
            if (Test-Path $p) { Get-Content $p -Tail 60 } else { Write-Host "(absent)" }
          }

      - name: Uninstall leaves nothing behind
        if: always()
        shell: pwsh
        run: |
          # UNINSTALL.md § 4 is what a user is told to run when this fails, so it
          # is part of the path under test.
          $cfg = Join-Path $env:USERPROFILE '.claude-glm'
          $bin = Join-Path $env:USERPROFILE 'bin'
          # By what it is, not by name: `Stop-Process -Name litellm` stops every
          # LiteLLM on the machine, which is what UNINSTALL.md tells users not
          # to do. The uninstall path is under test here too.
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*claude-glm*litellm*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Remove-Item -Force (Join-Path $env:USERPROFILE 'claude-env.txt') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $cfg -ErrorAction SilentlyContinue
          Remove-Item -Force (Join-Path $bin 'claude-glm.cmd') -ErrorAction SilentlyContinue
          $userPath = [Environment]::GetEnvironmentVariable('Path','User')
          $trimmed = ($userPath -split ';' | Where-Object { $_ -ne $bin }) -join ';'
          [Environment]::SetEnvironmentVariable('Path', $trimmed, 'User')
          Write-Host "removed; User PATH now: $trimmed"
