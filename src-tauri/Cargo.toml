[package]
name = "scale"
version = "1.8.6"
description = "BYO-key desktop chat client for GLM-5.2 on Scaleway"
authors = ["Jacob Bergmann Larsen"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "scale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
base64 = "0.22"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
# Document text extraction (PDF / .docx / .odt uploads)
pdf-extract = "0.12"
# Deflate only, which is the one method OOXML and ODT actually use — the
# formats require it, and Word, Excel, PowerPoint and LibreOffice all write it.
#
# The default features add bzip2, lzma, zstd and deflate64, three of which are C
# libraries. Their allocations do not pass through Rust's global allocator, and
# that allocator is the whole basis of the extraction helper's memory ceiling:
# `doc_sandbox` claimed "no allocation route bypasses Rust's allocator" on the
# strength of flate2 being pure Rust, which was true of flate2 and not of these.
# Turning them off removes the gap rather than bounding it, drops three C
# dependencies and their advisory surface, and makes an archive using an exotic
# method a refusal — which is the right answer for a format that does not permit
# one.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# System locale, for the Staan search market
sys-locale = "0.3"
# HTML → readable text, for the agent's fetch_page tool
html2text = "0.13"
# Safe arithmetic evaluator for the agent's calculate tool (no I/O, no shell).
# meval is f64-only, so no silent integer-division truncation (10/3 = 3.33…).
meval = "0.2"
jpeg-decoder = { version = "0.3.2", default-features = false }

lopdf = { version = "0.42.0", default-features = false }

# O_NOFOLLOW for workspace file operations, so a path validated as inside the
# chosen folder cannot be swapped for a symlink before it is opened. Already in
# the dependency graph transitively — naming it here adds no crate to the build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Not on Windows: tauri's `test` harness (MockRuntime) links a webview loader
# that won't start the test binary in headless Windows CI (STATUS_ENTRYPOINT_
# NOT_FOUND). The send_chat scenario tests that need it are OS-independent and
# run on the macOS/Linux CI legs; they're compiled out on Windows.
[dev-dependencies]
# Builds the compressed streams for the PDF decompression-bomb test, so the
# fixture is generated and readable rather than a binary blob in the repository.
flate2 = "1"

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
# Mock OpenAI-compatible server for the send_chat scenario tests.
wiremock = "0.6"
# The `test` feature provides mock_builder()/mock App for a real AppHandle.
tauri = { version = "2", features = ["test"] }

# Text recognition uses the operating system's own engine, or there is none.
# Models were bundled for a while so Linux had a floor; they were removed in
# 1.8.2 because the licence for the artifacts that worked could not be
# established, and because what they produced — "EUR 2.450" for "EUR 12,450" on
# a clean scan — was not worth the doubt.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-vision = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    # RoInitialize: the helper is this binary re-executed from main, so nothing
    # has started the Windows Runtime on its thread.
    "Win32_System_WinRT",
    "Media_Ocr",
    "Graphics_Imaging",
    "Security_Cryptography",
    "Storage_Streams",
    "Foundation",
] }
