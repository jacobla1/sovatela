<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    App icon: private, AI-powered chat.
      bubble  = chat        keyhole = private / on-device       sparkle = AI
    Brand purple (#6b4bff family). Flat vector twin of the glossy render —
    stays crisp at every size. Rasterise to a 1024x1024 PNG for `tauri icon`.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b66"/>
      <stop offset="1" stop-color="#221a40"/>
    </linearGradient>
    <linearGradient id="bubble" gradientUnits="userSpaceOnUse" x1="512" y1="306" x2="512" y2="700">
      <stop offset="0" stop-color="#9d7dff"/>
      <stop offset="1" stop-color="#7a55f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#c9b6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9b6ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bubble = rounded body + tail; the keyhole is punched out via the mask -->
    <mask id="keyhole">
      <rect x="288" y="306" width="448" height="308" rx="130" fill="#fff"/>
      <path d="M 402 584 Q 372 662 372 692 Q 372 710 392 700 Q 468 642 500 598 Z" fill="#fff"/>
      <circle cx="512" cy="430" r="44" fill="#000"/>
      <path d="M 500 446 L 486 542 L 538 542 L 524 446 Z" fill="#000"/>
    </mask>
  </defs>

  <!-- Tile -->
  <rect x="112" y="112" width="800" height="800" rx="180" fill="url(#tile)"/>

  <!-- Bubble with the keyhole cut through to the tile -->
  <g mask="url(#keyhole)">
    <rect x="288" y="306" width="448" height="308" rx="130" fill="url(#bubble)"/>
    <path d="M 402 584 Q 372 662 372 692 Q 372 710 392 700 Q 468 642 500 598 Z" fill="url(#bubble)"/>
  </g>

  <!-- AI sparkle glint, upper-right -->
  <circle cx="758" cy="306" r="120" fill="url(#glow)"/>
  <path d="M 758 240 Q 767 297 824 306 Q 767 315 758 372 Q 749 315 692 306 Q 749 297 758 240 Z" fill="#ffffff"/>
  <path d="M 680 206 Q 684 228 706 232 Q 684 236 680 258 Q 676 236 654 232 Q 676 228 680 206 Z" fill="#ffffff" opacity="0.75"/>
</svg>
