name: ci

# Build + test on all three desktop OSes, and validate the claude-glm
# credential-read path per platform. Deliberately NOT run on every push —
# a 3-OS Tauri build (macOS billed 10x) is costly — so it runs on PRs to main
# and on demand. Trigger it manually before cutting a release:
#   Actions → ci → Run workflow
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    # The public repository is a generated mirror and this workflow ships to it
    # verbatim. Every other job in every other workflow carries this line — the
    # commit that added them is called "Guard the workflows: a mirror must never
    # build" — and this one was missed, so a pull request opened against the
    # mirror would have started a three-OS Tauri build on it.
    if: github.repository == 'jacobla1/Scale'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Frontend must build first: the Tauri app embeds ../dist at compile time.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests (vitest)
        run: npm test

      # This is the main gap-closer: compiling the app on Windows/Linux checks
      # the per-OS #[cfg] branches (claude_glm_status / install_claude_glm) that
      # can't be cross-compiled from macOS.
      - name: Build app
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The extraction helper, run the way the application runs it.
      #
      # This exists because a unit test could not have found what it is looking
      # for. Two tests that constructed the system recogniser killed the Windows
      # test process with an access violation — no failure reported, the process
      # simply gone — and that was the first time that code had executed on
      # Windows anywhere: CI had compiled it on every run for weeks and never
      # once called it. A test cannot assert anything after an access violation,
      # because the asserting process is the one that dies. So the helper is
      # spawned as a subprocess, exactly as the app spawns it, and judged on how
      # it exits.
      #
      # Only two exits are acceptable: 0, meaning text came back, and 33,
      # meaning a clean refusal — no recogniser, no language pack, a page it
      # will not read. Anything else is a death, and a death here is the fault
      # this is watching for.
      #
      # The runners almost certainly have no OCR language pack, so on Windows
      # the expected result is 33 and not 0. That is the point: a missing
      # language pack must be a refusal rather than a crash, and that is the
      # half of the question CI can settle. Whether it can actually *read* a
      # scan still needs a machine with a language pack on it.
      - name: The extraction helper reads a scanned PDF
        shell: bash
        run: |
          set -u
          node qa/ocr/make-scan.mjs scan.pdf "SOVATELA OCR" "INVOICE 12345"
          bin=src-tauri/target/debug/scale
          [ -x "$bin" ] || bin=src-tauri/target/debug/scale.exe
          set +e
          "$bin" --sovatela-extract-doc-helper pdf < scan.pdf > helper-out.txt 2> helper-err.txt
          code=$?
          set -e
          echo "helper exit: $code"
          echo "--- stdout ---"; head -c 2000 helper-out.txt || true
          echo; echo "--- stderr ---"; head -c 2000 helper-err.txt || true; echo

          # A death is a death everywhere. 0 means text came back, 33 a clean
          # refusal; anything else is a crash, a hang, or an exit this binary
          # does not use — which is the fault this step exists for.
          if [ "$code" -ne 0 ] && [ "$code" -ne 33 ]; then
            echo "::error::the extraction helper did not exit cleanly (code $code)."
            exit 1
          fi

          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            # Linux has no system recogniser and is not expected to grow one.
            # What it must do is say so, rather than report an empty document.
            [ "$code" -eq 33 ] || { echo "::error::Linux returned text it cannot read"; exit 1; }
            grep -qi "recogniser built into the operating system" helper-out.txt \
              || { echo "::error::Linux did not explain why it cannot read a scan"; exit 1; }
            echo "Linux refused, and said why."
            exit 0
          fi

          # macOS and Windows have a recogniser, so the page must actually be
          # read: text has to come back, and it has to be the text on the page.
          [ "$code" -eq 0 ] || {
            echo "::error::nothing was read from a scan with words on it (exit $code)"
            exit 1
          }

          # What is asserted, and why it is not the whole string.
          #
          # The letters are drawn from a 5×7 bitmap alphabet, which is a hard
          # input rather than a representative one: at five pixels wide a V and
          # a U differ by two rows. Windows reads "SOURTELR" for "SOVATELA" and
          # "INUOICE" for "INVOICE"; macOS reads both exactly. That is the
          # fixture's fault more than the engine's, and holding a release gate
          # to character-perfect recognition of a bitmap font would make it a
          # test of my glyphs.
          #
          # So this asserts what a working recogniser must produce and a broken
          # one cannot: the digits, which are unambiguous at this size and which
          # both engines read exactly; the word OCR; and enough characters
          # overall that a single stray mark cannot pass. Whether the prose is
          # accurate on a *real* scan is a question for a real document, and it
          # is a QA row rather than a CI gate.
          got=$(tr -d '\r' < helper-out.txt | tr '[:lower:]' '[:upper:]' | tr -cd 'A-Z0-9')
          # Drop the preamble, which is this app's own words and not the page's.
          page=${got#*MISTAKES}
          for want in 12345 OCR; do
            case "$page" in
              *"$want"*) ;;
              *)
                echo "::error::the recogniser did not read \"$want\" from the scan."
                echo "::error::what came back, normalised: $page"
                exit 1
                ;;
            esac
          done
          if [ "${#page}" -lt 15 ]; then
            echo "::error::almost nothing was read: $page"
            exit 1
          fi
          echo "Read from the picture: $page"

          # A page that cannot be read must say so, even when another page was
          # read fine.
          #
          # This is the defect that withdrew 1.8.4. A refusal was recorded and
          # then discarded the moment any other page succeeded, so a two-page
          # contract came back as a complete-looking one-page document —
          # success, no warning, no sign a page had existed. An external
          # reviewer found it in the published binary; nothing here could,
          # because every fixture was one page.
          node qa/ocr/make-scan.mjs two.pdf "SOVATELA OCR" "INVOICE 12345" --with-refused-page
          set +e
          "$bin" --sovatela-extract-doc-helper pdf < two.pdf > two-out.txt 2>/dev/null
          two_code=$?
          set -e
          echo "two-page helper exit: $two_code"
          sed 's/^/  /' two-out.txt
          if [ "$two_code" -ne 0 ] && [ "$two_code" -ne 33 ]; then
            echo "::error::the helper did not exit cleanly on a two-page scan ($two_code)"
            exit 1
          fi
          # On a platform with a recogniser page one is read, and page two must
          # then be named. Where there is none the whole document is refused,
          # and there is nothing to account for.
          if grep -q "\[Page 1\]" two-out.txt; then
            grep -q "\[Page 2\]" two-out.txt || {
              echo "::error::page 2 vanished from a two-page scan — the 1.8.4 defect is back"
              exit 1
            }
            grep -q "could not be read" two-out.txt || {
              echo "::error::page 2 is listed but not as a failure"
              exit 1
            }
            echo "The unreadable page was named rather than dropped."
          else
            echo "No page was read here, so the whole document was refused — nothing to account for."
          fi

          # A readable page followed by one the *recogniser* refuses. A different
          # seam from the two-picture page above, and open until 1.8.6.
          #
          # That one fails while the extractor is deciding which picture on the
          # page is the scan — before the recogniser is reached — and was
          # collected as a page outcome like any other. A refusal from inside
          # `engine.read`, which is where a two-column layout is rejected,
          # propagated out of the whole function and took every page already read
          # with it: twenty good pages discarded because the twenty-first was
          # laid out in columns.
          #
          # Found by external review after 1.8.5 shipped, against notes that
          # described the release as accounting for every page. No unit test
          # could have seen it — they all drive the reporting decision directly,
          # which is the half that was already right.
          node qa/ocr/make-scan.mjs recog.pdf "SOVATELA OCR" "INVOICE 12345" --with-two-column-page
          set +e
          "$bin" --sovatela-extract-doc-helper pdf < recog.pdf > recog-out.txt 2>/dev/null
          recog_code=$?
          set -e
          echo "recogniser-refusal helper exit: $recog_code"
          sed 's/^/  /' recog-out.txt
          if [ "$recog_code" -ne 0 ] && [ "$recog_code" -ne 33 ]; then
            echo "::error::the helper did not exit cleanly on a recogniser refusal ($recog_code)"
            exit 1
          fi
          # Only meaningful where there is a recogniser at all. On Linux the
          # document is refused whole and there is nothing to have kept.
          if grep -q "\[Page 1\]" recog-out.txt; then
            # The digits, not the phrase — the same rule as the single-page
            # assertion above and for the same reason. Windows reads "INUOICE"
            # for "INVOICE" off a 5×7 bitmap alphabet, so grepping for the whole
            # string tests the glyphs rather than the fix. It failed on exactly
            # that: Windows had kept page 1 and named page 2, correctly, and the
            # assertion called it a discarded page.
            #
            # 12345 is unambiguous at this size, both engines read it exactly,
            # and page 2 is refused so it contributes no text — the digits can
            # only be page 1's.
            tr -d '\r' < recog-out.txt | tr -cd '0-9' | grep -q 12345 || {
              echo "::error::page 1 was read and then discarded when page 2 was refused"
              exit 1
            }
            grep -q "\[Page 2\] could not be read" recog-out.txt || {
              echo "::error::the recogniser's refusal of page 2 was not reported"
              exit 1
            }
            echo "A recogniser refusal kept the pages already read, and named the page it refused."
          else
            echo "No recogniser here, so the document was refused whole — nothing to keep."
          fi

      # The same command the release gate runs, and for the reason it exists:
      # until 1.8.1 this ran *only* at release time, so a lint that fires on one
      # platform was first seen when a tag had already been pushed. A
      # Linux-only dead-code warning stopped a release that way, having passed
      # every green CI run before it. A gate whose first exercise is the
      # release is not a gate, it is a surprise.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # ---- claude-glm installer script validation --------------------------
      - name: Check installer scripts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          zsh -n deploy/claude-glm/install-claude-glm.command
          bash -n deploy/claude-glm/install-claude-glm.sh
          echo "macOS/Linux installer scripts parse OK"

      - name: Check installer script (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          bash -n deploy/claude-glm/install-claude-glm.sh
          echo "Linux installer script parses OK"

      - name: Check installer + launcher (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Parse the installer, then extract the embedded launcher and compile
          # its C# CredRead type — the same check that caught the -MemberDefinition bug.
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw deploy/claude-glm/install-claude-glm.ps1), [ref]$null)
          $src = Get-Content -Raw deploy/claude-glm/install-claude-glm.ps1
          $m = [regex]::Match($src, "(?s)-TypeDefinition @""(.*?)""@")
          if (-not $m.Success) { throw "launcher C# type block not found" }
          Add-Type -TypeDefinition $m.Groups[1].Value
          if (-not [GlmCred.Native].GetMethod('Read')) { throw "CredRead method missing" }
          "Windows installer parses + launcher C# compiles OK"

      # ---- claude-glm credential round-trip --------------------------------
      # Seed the OS credential store in the exact format the keyring crate uses
      # (verified against keyring 3.6.3 source), then run the launcher's read
      # path and assert the key comes back. Validates the shared-credential
      # contract end to end, minus the desktop app doing the write.
      - name: Credential round-trip (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          BLOB='{"scaleway_api_key":"SCW-ci-test-123","linkup_key":"x"}'
          security add-generic-password -s com.anaubi.sovatela -a secrets -w "$BLOB" -U
          got=$(security find-generic-password -s com.anaubi.sovatela -a secrets -w)
          key=$(printf '%s' "$got" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write((JSON.parse(s).scaleway_api_key||"").trim())}catch(e){}})')
          security delete-generic-password -s com.anaubi.sovatela -a secrets >/dev/null 2>&1 || true
          [ "$key" = "SCW-ci-test-123" ] && echo "macOS credential round-trip: OK" || { echo "FAIL: got '$key'"; exit 1; }

      - name: Credential round-trip (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11
          # Run inside a fresh D-Bus session with an unlocked secret-service, then
          # store the JSON blob under the keyring attributes the desktop app uses
          # and confirm a lookup returns it. Single-quoted bash -c body (no inner
          # single quotes) so YAML/shell quoting stays simple.
          dbus-run-session -- bash -c '
            set -e
            eval "$(printf "dummy\n" | gnome-keyring-daemon --components=secrets --daemonize --unlock)"
            printf "%s" "{\"scaleway_api_key\":\"SCW-ci-test-123\"}" | secret-tool store --label=glmtest service com.anaubi.sovatela username secrets
            got=$(secret-tool lookup service com.anaubi.sovatela username secrets)
            echo "$got" | grep -q "SCW-ci-test-123" && echo "Linux credential round-trip: OK" || { echo "FAIL: got $got"; exit 1; }
          '

      - name: Credential round-trip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          namespace GlmCredTest {
            [StructLayout(LayoutKind.Sequential)]
            public struct CREDENTIAL {
              public uint Flags; public uint Type; public IntPtr TargetName; public IntPtr Comment;
              public System.Runtime.InteropServices.ComTypes.FILETIME LastWritten;
              public uint CredentialBlobSize; public IntPtr CredentialBlob; public uint Persist;
              public uint AttributeCount; public IntPtr Attributes; public IntPtr TargetAlias; public IntPtr UserName;
            }
            public static class N {
              [DllImport("advapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)]
              public static extern bool CredWriteW(ref CREDENTIAL c, uint flags);
              [DllImport("advapi32.dll", SetLastError=true, CharSet=CharSet.Unicode)]
              public static extern bool CredReadW(string target, uint type, uint flags, out IntPtr cred);
              [DllImport("advapi32.dll")]
              public static extern void CredFree(IntPtr cred);
              public static void Write(string target, byte[] blob) {
                CREDENTIAL c = new CREDENTIAL();
                c.Type = 1; c.Persist = 3;
                c.TargetName = Marshal.StringToCoTaskMemUni(target);
                c.UserName = Marshal.StringToCoTaskMemUni("secrets");
                c.CredentialBlobSize = (uint)blob.Length;
                c.CredentialBlob = Marshal.AllocCoTaskMem(blob.Length);
                Marshal.Copy(blob, 0, c.CredentialBlob, blob.Length);
                if (!CredWriteW(ref c, 0)) throw new Exception("CredWrite failed: " + Marshal.GetLastWin32Error());
              }
              public static byte[] Read(string target) {
                IntPtr p;
                if (!CredReadW(target, 1, 0, out p)) return null;
                try {
                  CREDENTIAL c = (CREDENTIAL)Marshal.PtrToStructure(p, typeof(CREDENTIAL));
                  byte[] b = new byte[c.CredentialBlobSize];
                  Marshal.Copy(c.CredentialBlob, b, 0, (int)c.CredentialBlobSize);
                  return b;
                } finally { CredFree(p); }
              }
            }
          }
          "@
          $blob = [System.Text.Encoding]::Unicode.GetBytes('{"scaleway_api_key":"SCW-ci-test-123","linkup_key":"x"}')
          [GlmCredTest.N]::Write('secrets.com.anaubi.sovatela', $blob)
          $bytes = [GlmCredTest.N]::Read('secrets.com.anaubi.sovatela')
          $json = [System.Text.Encoding]::Unicode.GetString($bytes)
          $key = ([string]((ConvertFrom-Json $json).scaleway_api_key)).Trim()
          cmdkey /delete:secrets.com.anaubi.sovatela | Out-Null
          if ($key -ne 'SCW-ci-test-123') { throw "FAIL: got '$key'" }
          "Windows credential round-trip: OK"
