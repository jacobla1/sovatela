# Local SearXNG for the Sovatela app — runs on your own machine, no server needed.
# `restart: unless-stopped` means the container comes back automatically whenever
# Docker starts (so it survives reboots, as long as Docker starts on login).

services:
  searxng:
    # Pinned. `latest` meant every `docker compose up` could pull a build
    # nobody here had looked at, on a machine the app sends search queries
    # to. Bump deliberately: read the release notes, change both this tag
    # and the digest, and test.
    image: searxng/searxng:2026.9.1-18af21159@sha256:c7cc75852051bf6254afda6ed1b920dd1677d8efe4ab141bf558f02e582f4371
    container_name: searxng-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080" # localhost only
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
