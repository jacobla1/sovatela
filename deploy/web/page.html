<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The site runs no JavaScript and loads nothing from anywhere else, so the
       policy is the strictest one that still renders it: nothing is permitted
       by default, images only from this origin, and inline styles because the
       CSS is in the <style> block above rather than a file.

       As a meta tag rather than a response header, because sovatela.eu is on
       GitHub Pages and Pages cannot set headers. That costs three things a
       header would give: `frame-ancestors` is ignored in meta form, and
       `X-Content-Type-Options: nosniff` and a real `Referrer-Policy` header
       have no meta equivalent at all. The referrer is set below by the one
       mechanism that does work in markup. See TECHNICAL-SPEC.md § 7. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
  <!-- An outbound link to Scaleway or GitHub should not carry which page on a
       privacy tool the reader came from. -->
  <meta name="referrer" content="no-referrer" />
  <title>{{TITLE}} — Sovatela</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e4e6eb;
      --accent: #5a37f0;
      --accent-2: #6b4bff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181c;
        --card: #1f2126;
        --text: #ededed;
        --muted: #b4b9c2;
        --border: #2c2f36;
        --accent: #7c5cff;
        --accent-2: #8b6bff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.65;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }
    .back { display: inline-block; margin-bottom: 28px; color: var(--accent-2); font-size: 14px; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    h1 { font-size: 30px; margin: 0 0 20px; letter-spacing: -0.02em; }
    h2 { font-size: 20px; margin: 40px 0 12px; letter-spacing: -0.01em; }
    h3 { font-size: 16px; margin: 28px 0 10px; }
    p, li { font-size: 15.5px; }
    a { color: var(--accent-2); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px;
    }
    pre {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      overflow-x: auto;
    }
    pre code { background: none; border: 0; padding: 0; }
    blockquote {
      margin: 20px 0;
      padding: 2px 18px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }
    table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 20px 0; display: block; overflow-x: auto; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { font-weight: 600; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 36px 0; }
    footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; line-height: 1.7; }
    footer a { color: var(--accent-2); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Sovatela</a>
    {{BODY}}
    <footer>
      <p>
        {{POLICY_LINKS}}
      </p>
      <p>
        Published by <strong>Jacob Bergmann Larsen</strong> ·
        <a href="mailto:info@anaubi.com">info@anaubi.com</a> ·
        {{SOURCE_LINK}}
      </p>
    </footer>
  </div>
</body>
</html>
