name: release

# Builds installers on each OS and attaches them to a GitHub Release.
# Trigger by pushing a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  # The Windows terminal-access installer is compiled into the binary, so a
  # broken one can only be fixed by another release. It shipped broken twice
  # before anyone ran it. Nothing is built until it is run.
  windows-terminal-access:
    if: github.repository == 'jacobla1/sovatela'
    uses: ./.github/workflows/windows-terminal-access.yml

  # Tests gate the tag. `ci` runs the same suites across three OSes, but it only
  # triggers on pull requests and manual dispatch — and work here lands straight
  # on main — so through 1.4.0 nothing stopped a tag whose tests were red. A
  # `needs:` cannot reach a job in another workflow file, and re-running the full
  # 3-OS `ci` matrix here would compile Tauri twice per release for no new
  # signal: the per-OS compile is already proven by the build job below, which
  # fails the release if any platform stops building. So this runs the suites
  # themselves, once, on the cheapest runner.
  tests:
    if: github.repository == 'jacobla1/sovatela'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # The Tauri crate embeds ../dist at compile time, so the frontend must be
      # built before cargo can compile the test binary.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests (vitest)
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # These run on proposed changes in `audit.yml`, which does not run on a
      # tag — so 1.5.5 was built, signed and published from source that failed
      # the format check, and nothing in the release log said so. A release is
      # exactly when a repository is held up as evidence, so the checks that
      # keep it readable belong here too.
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    needs: [windows-terminal-access, tests]
    # This builds in the PUBLIC repository, which is where the provenance can
    # be published: GitHub's build attestations are free for public repos and
    # need Enterprise Cloud for private ones, so a private build can be signed
    # by Apple but cannot prove which commit produced it. Those answer different
    # questions — notarization says Apple checked it for malware, provenance
    # says this workflow at this commit built it — and only one of them was
    # available while the build lived in the private repository.
    #
    # The historical hazard this replaces: `gh release create` used to create
    # the tag on the mirror at whatever main was, and because source was
    # published after the release, that tag pointed at the previous version's
    # code. The mirror then ran its own copy of this workflow and attached the
    # previous version's installers — the strays on v1.3.0, v1.3.1 and v1.4.0.
    # The order that prevents it is unchanged and is now the only order there
    # is: publish the source, then tag, then this builds from that tag.
    if: github.repository == 'jacobla1/sovatela'
    permissions:
      contents: write # needed to create the Release and upload assets
    #
    # macOS is deliberately NOT in this matrix. It is the only platform that
    # needs the Apple certificate, and this workflow now runs in a public
    # repository, so the certificate is scoped to exactly one job that says so
    # in its name — `build-macos` below, behind an environment that pauses for
    # the maintainer's approval. Linux and Windows read no secret of any kind.
    #
    # Splitting costs some duplicated setup steps. That is the price of being
    # able to answer "which job can spend the signing key" by reading the file
    # rather than by reasoning about matrix expressions.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux: .deb + .AppImage
            args: ""
          - platform: windows-latest # Windows: .msi + .exe (NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # No Apple secrets here, and none available to this job. These are the
          # unsigned platforms; the certificate lives in `build-macos`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          # Keep this in sync with productName in tauri.conf.json — it is the
          # title people see on the Releases page. It said "GLM Chat" for the
          # first release after the Sovatela rename.
          releaseName: "Sovatela v__VERSION__"
          # The macOS line below assumes the APPLE_* secrets above are present and
          # valid. tauri-action degrades to an unsigned build rather than failing
          # when they are missing or expired, so a lapsed certificate would make
          # this claim false with nothing in the log to flag it. Before a release,
          # confirm on the built artifact:
          #   spctl -a -t exec -vv /Volumes/Sovatela/Sovatela.app
          # expecting "accepted / source=Notarized Developer ID". (The .dmg itself
          # reports as unnotarized — tauri staples the ticket to the .app inside,
          # which is what Gatekeeper assesses at launch.)
          releaseBody: |
            Download the installer for your platform below.

            See [CHANGELOG.md](https://github.com/jacobla1/sovatela/blob/main/CHANGELOG.md) for what changed in this version.

            **Verify your download.** Three checks, strongest last:

                # 1. the file arrived intact
                shasum -a 256 -c SHA256SUMS.txt --ignore-missing

                # 2. the publisher vouches for that list
                minisign -Vm SHA256SUMS.txt -P <the key published at sovatela.eu>

                # 3. this commit and workflow produced the file
                gh attestation verify <file> --repo jacobla1/sovatela

            Signing status is not asserted in this template. tauri-action
            degrades to an unsigned build rather than failing when the Apple
            secrets are missing or expired, and nothing in the log flags it, so
            a claim written here would be believed on every release whether or
            not it was true. It is checked on the artifact instead, before the
            draft is published:

                hdiutil attach Sovatela_*_universal.dmg
                spctl -a -t exec -vv /Volumes/Sovatela/Sovatela.app
                # expect: accepted / source=Notarized Developer ID

            Windows and Linux builds are not code-signed; SmartScreen will warn.
            They have also never been installed, upgraded and removed on a clean
            machine — treat them as experimental.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The only job that ever sees the Apple certificate.
  #
  # `environment: release` is what makes that statement enforceable rather than
  # aspirational. The Apple secrets are attached to that environment, not to the
  # repository, so no other job in this workflow — and no workflow added later —
  # can read them without also naming the environment, which pauses for a
  # maintainer's approval before the job starts. In a public repository that is
  # the difference between "a merged workflow change could spend the signing
  # key" and "a merged workflow change produces an approval request".
  build-macos:
    needs: [windows-terminal-access, tests]
    if: github.repository == 'jacobla1/sovatela'
    environment: release
    permissions:
      contents: write # needed to create the Release and upload assets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing and notarization. tauri-action degrades to an unsigned
          # build rather than failing when these are missing or expired, and
          # nothing in the log flags it — which is why the release procedure
          # verifies the artifact with scripts/verify-notarization.sh instead of
          # trusting this step's exit code.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Notarization via the Apple ID method (app-specific password).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sovatela v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: "--target universal-apple-darwin"

  # Every asset on the release must belong to the tag being released.
  #
  # v1.3.1 shipped carrying five of v1.3.0's Linux and Windows installers, and
  # v1.3.0 carried v1.2.0's the same way. Three of the strays were downloaded.
  # None were covered by SHA256SUMS.txt, so they sat unverifiable on a page that
  # tells people to verify. It went unnoticed for weeks and surfaced only because
  # the *site* build refuses mixed-version artifacts — a guard that protects the
  # download page, not the release.
  #
  # This fails the run rather than deleting anything. An unexpected binary on a
  # release is the shape a compromised pipeline takes, and deciding what to do
  # about one is a person's job. The release is still a draft here, so a failure
  # lands before it can be published.
  # Notarization, checked by the machine rather than remembered by a person.
  #
  # Every page in this repository warns that `tauri-action` degrades to an
  # unsigned build rather than failing when the Apple secrets are missing, and
  # that nothing in the log flags it. The answer to that was a paragraph in the
  # release procedure telling the maintainer to run a script by hand — which
  # works right up until the release someone is in a hurry for.
  #
  # So it runs here, on the artifact the draft actually holds, and
  # `verify-release-assets` will not proceed without it. The two failures during
  # 1.7.0 were loud 401s rather than silent downgrades, so the realistic case
  # this catches is a certificate that has expired or a secret that has been
  # removed — both of which produce a build that looks fine and is not signed.
  verify-macos-signature:
    needs: [build-macos]
    if: github.repository == 'jacobla1/sovatela'
    runs-on: macos-latest
    permissions:
      # `write`, not `read`, and the job below has carried the reason in a
      # comment since before this one existed: a draft release is not visible
      # to a read-only token. With `read` this failed on its first live run
      # with "release not found" — the check could not see the artifact it
      # exists to check.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the published .dmg is signed, notarized and stapled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dmg="Sovatela_${version}_universal.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$dmg"
          # Fails the run on an unsigned, un-notarized or unstapled build, and
          # on one carrying the wrong version — the mistake that once made a
          # 1.2.0 app pass as 1.3.0.
          ./scripts/verify-notarization.sh "$dmg" "$version"

  verify-release-assets:
    needs: [build, build-macos, verify-macos-signature]
    if: github.repository == 'jacobla1/sovatela'
    runs-on: ubuntu-latest
    permissions:
      contents: write # a draft release is not visible to a read-only token
      id-token: write # Sigstore identity for the build attestations
      attestations: write # write the attestations themselves
    steps:
      # Needed only by the terms-archive step below; every other step here
      # talks to the release through `gh` and touches no files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/TERMS.md § 2 tells people the page they accepted can be read
      # rather than reconstructed. That is only true if a copy is kept beside
      # the release it went out with.
      #
      # It replaced an "Applies to: Sovatela vX.Y.Z" stamp, which went stale
      # twice — it read v1.2.0 while 1.6.0 was public, then v1.6.1 while the
      # v1.6.1 tag still held the unpublished fourteen-section draft. A stamp
      # written before the tag is cut can only describe a release it has not
      # seen. An attached file is written at the moment the release is made,
      # so it cannot disagree with it.
      #
      # The public part only: everything after the marker is the maintainer's
      # record of what was dropped and why, not a term anyone agreed to. It is
      # in the repository either way.
      - name: Archive the terms as they stood for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          out="TERMS-${version}.md"
          sed '/<!-- public:end -->/,$d' docs/TERMS.md > "$out"
          # An empty or truncated file archived as the terms is worse than none.
          if [ "$(wc -c < "$out")" -lt 2000 ]; then
            echo "$out is $(wc -c < "$out") bytes — that is not the terms page."
            exit 1
          fi
          gh release upload "$TAG" "$out" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Archived $out onto $TAG."

      # tauri-action always uploads the macOS updater bundle. There is no
      # updater — Settings → About has a manual version check, not a channel
      # that consumes this — so it is a 12 MB file on the download page that
      # nobody can use and that invites the question of what it is for. It has
      # been deleted by hand on every release since the .dmg started shipping,
      # which is exactly the kind of recurring manual step that produced the
      # stray-installer bug.
      #
      # The guard below does not catch it either way. Before tauri-action
      # 1.0.0 the tarball carried no version in its name, and files without
      # one are exempt so that SHA256SUMS.txt passes; from 1.0.0 it carries
      # the version, which matches the tag and so is not a stray. The removal
      # here matches on the extension rather than the filename, which is why
      # that rename did not break it.
      - name: Drop the updater bundle nobody can use
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' \
            | grep -E '\.app\.tar\.gz(\.sig)?$' > bundles.txt || true
          if [ ! -s bundles.txt ]; then
            echo "No updater bundle on the release — nothing to remove."
            exit 0
          fi
          while read -r name; do
            echo "Removing $name"
            gh release delete-asset "$TAG" "$name" \
              --repo "$GITHUB_REPOSITORY" --yes
          done < bundles.txt

      - name: Every asset matches the tag, and no platform is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "Tag $TAG — expecting every asset to be version $version"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > assets.txt
          echo "On the release:"
          sed 's/^/  /' assets.txt

          # 1. Nothing carrying a version other than this tag's. Files with no
          #    version in the name (SHA256SUMS.txt) are left alone.
          : > strays.txt
          while read -r name; do
            found=$(printf '%s\n' "$name" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
            if [ -n "$found" ] && [ "$found" != "$version" ]; then
              echo "  $name — is $found, expected $version" >> strays.txt
            fi
          done < assets.txt

          # 2. Every installer the matrix builds actually arrived. fail-fast is
          #    false, so one leg can fail while the others still produce a
          #    release that is quietly missing a platform.
          : > missing.txt
          for ext in .dmg -setup.exe .msi .AppImage .deb .rpm; do
            grep -qF -- "$ext" assets.txt || echo "  $ext" >> missing.txt
          done

          fail=0
          if [ -s strays.txt ]; then
            echo; echo "Assets that do not belong to $version:"; cat strays.txt; fail=1
          fi
          if [ -s missing.txt ]; then
            echo; echo "No installer was uploaded for:"; cat missing.txt; fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo
            echo "The release is still a draft. Fix it before publishing."
            exit 1
          fi
          echo "OK — every asset is $version, and all six installers are present."

      # ---------------------------------------------------------------------
      # Checksums, a signature over them, and provenance for every artifact.
      #
      # Until now SHA256SUMS.txt was produced by hand on the maintainer's
      # machine and uploaded alongside the installers. A checksum list that
      # travels with the files it vouches for, unsigned, proves only that the
      # download was not corrupted in transit — anyone able to replace one could
      # replace both, and the download page said so.
      #
      # Two different claims are made here, and they are not substitutes:
      #
      #   * the minisign signature says *the publisher vouches for this list*,
      #     and is checkable offline with one command and a published key, with
      #     no GitHub account involved;
      #   * the build attestation says *this workflow, at this commit, produced
      #     these bytes*, which is the question a signature cannot answer and
      #     the reason the build moved to the public repository at all.
      # ---------------------------------------------------------------------
      - name: Collect the published installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Sovatela*'
          version="${TAG#v}"
          # Named explicitly and in a fixed order, so the file is byte-identical
          # for the same inputs and a missing platform is a failure rather than
          # a shorter list nobody reads.
          shasum -a 256 \
            "Sovatela_${version}_universal.dmg" \
            "Sovatela_${version}_x64-setup.exe" \
            "Sovatela_${version}_x64_en-US.msi" \
            "Sovatela_${version}_amd64.deb" \
            "Sovatela_${version}_amd64.AppImage" \
            "Sovatela-${version}-1.x86_64.rpm" \
            > SHA256SUMS.txt
          echo "Checksums:"; sed 's/^/  /' SHA256SUMS.txt

      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fail rather than publish an unsigned list. The Apple secrets taught
          # this lesson: a signing step that degrades quietly when its key is
          # missing produces releases that claim to be signed and are not.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "MINISIGN_SECRET_KEY is not set."
            echo "Generate a key once with:  minisign -G -W -p minisign.pub -s minisign.key"
            echo "then store minisign.key's contents as that secret and commit minisign.pub."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          cd release-assets
          minisign -S -s /tmp/minisign.key \
            -m SHA256SUMS.txt \
            -t "Sovatela $TAG checksums" </dev/null
          shred -u /tmp/minisign.key
          # Verify with the committed public key before publishing it, so a
          # mismatched key pair fails here rather than in a user's terminal.
          if [ ! -f "$GITHUB_WORKSPACE/minisign.pub" ]; then
            echo "minisign.pub is not in the repository, so the signature this"
            echo "run just made cannot be checked against the key people will"
            echo "use. Commit the public half of the key pair as minisign.pub."
            exit 1
          fi
          minisign -Vm SHA256SUMS.txt -p "$GITHUB_WORKSPACE/minisign.pub"

      - name: Attach the checksums and their signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            release-assets/SHA256SUMS.txt \
            release-assets/SHA256SUMS.txt.minisig \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Binds every installer and the checksum list to this workflow, this run
      # and this commit. Free for public repositories; needs Enterprise Cloud
      # for private ones, which is why this could not exist before the build
      # moved. Verified by a user with:
      #   gh attestation verify <file> --repo jacobla1/sovatela
      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/Sovatela*
            release-assets/SHA256SUMS.txt
