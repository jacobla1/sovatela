name: audit

# Dependency scanning for both toolchains.
#
# Deliberately NOT a release gate. `release.yml` runs the test suites before it
# builds, because a failing test means this code is broken. An advisory is
# different: it can be published against an unchanged lockfile on any morning,
# including one where a fix needs to ship. Blocking the release on that would
# mean a newly-disclosed bug in a transitive dependency could stop a security
# fix from going out, which is backwards. So this runs on pull requests, on a
# weekly schedule to catch advisories filed against code that has not changed,
# and on demand.
on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  npm:
    if: github.repository == 'jacobla1/Scale'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - run: npm ci

      # `npm audit` exits 1 both when it finds an advisory and when it cannot
      # reach the registry at all, and the second happens: this job failed on
      # 2026-09-03 because npmjs.org returned 503 for seven minutes. A red run
      # that means "npm was down" looks exactly like one that means "you have a
      # vulnerability", and a signal that cries wolf is one people stop reading.
      #
      # So: retry the transient case, and if the scan still cannot run, say so
      # in those words. It still fails — a scan that did not happen is not a
      # clean scan — but it fails saying something different.
      - name: Production dependencies
        # What ships to users. dompurify is the whole defence between
        # model-generated markdown and {@html}, so `moderate` is the bar here
        # rather than `high`: the advisory that prompted this scanning was a
        # moderate-severity XSS in exactly that library.
        run: .github/scripts/npm-audit.sh --omit=dev --audit-level=moderate

      # Build-time only. These do not reach a user's machine, but a compromised
      # build chain reaches every user, so it fails rather than warns.
      - name: Build and development dependencies
        run: .github/scripts/npm-audit.sh --audit-level=high

  cargo:
    if: github.repository == 'jacobla1/Scale'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Clippy below type-checks the real crate, which links the GTK stack via
      # Tauri. Without these the build fails at `glib-sys` before Clippy sees a
      # line of our code — which is what it had been doing on every run since
      # this job was added. `cargo audit` was unaffected and passing, because
      # it only reads Cargo.lock, so the job looked half-alive rather than
      # broken.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Everything in Cargo.lock ships inside the binary. Warnings for
      # unmaintained crates are not failures: the gtk-rs GTK3 bindings are
      # pulled in by Tauri's Linux stack and cannot be moved from here.
      - name: Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `-D warnings`, which this could not use until the standing warnings were
      # dealt with: two were fixed, and four are annotated at the code with the
      # reason they stay — two wide signatures where a parameter struct would
      # rename the problem rather than solve it, and two migration tables whose
      # shape is the thing a reader came to read.
      #
      # The lint that earned this step in the first place was `never_loop`,
      # which is deny-by-default and found a response parser whose every branch
      # returned: an endpoint answering with an empty field alongside a usable
      # one produced an empty image.
      #
      # The cost of the strict bar, stated so it is not a surprise: the
      # toolchain is `stable`, so a future clippy release can add a lint and
      # turn this red without anyone having changed the code. That is survivable
      # here because this workflow is not a release gate — it runs on pull
      # requests and weekly, and a tag does not wait for it.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
